<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#151022"><title>السعد | ALSAAD Chat</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f7efff;background:#100c1b}*{box-sizing:border-box}body{margin:0}main{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 80% 0%,#382043 0%,transparent 45%),#151022}.top{padding:22px 20px 15px;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800;letter-spacing:.5px}.brand span{color:#e8a1c9}.sub{font-size:12px;color:#c2b3ce;margin-top:5px}.status{font-size:12px;color:#a6d9bd}.chat{flex:1;overflow:auto;padding:22px 15px;display:flex;flex-direction:column;gap:13px}.empty{text-align:center;margin:auto;color:#c6b6ce;line-height:2}.bubble{max-width:87%;padding:13px 15px;border-radius:18px;background:#292138;align-self:flex-start;line-height:1.7;overflow-wrap:anywhere}.bubble.me{align-self:flex-end;background:#663457}.meta{font-size:11px;color:#e8cbdc;margin-bottom:4px}.original{margin-top:8px;padding-top:8px;border-top:1px solid #ffffff24;color:#ddcfe1;font-size:13px}.warn{font-size:11px;color:#ffd69a;margin-top:6px}.compose{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #ffffff18}input,select,button{font:inherit}input,select{background:#2b2338;border:1px solid #ffffff25;color:white;border-radius:14px;padding:13px;min-width:0}input{flex:1}button{border:0;border-radius:14px;background:#d77ba9;color:#21111e;padding:12px 19px;font-weight:750;cursor:pointer}.overlay{position:fixed;inset:0;background:#100c1bf5;display:grid;place-items:center;padding:20px}.panel{width:min(100%,420px);background:#241b32;border:1px solid #ffffff20;border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 80px #0006}.panel h1{margin:0;text-align:center;font-size:31px}.panel p{color:#d3c5da;line-height:1.8;margin:0;text-align:center}.panel label{font-size:13px}.panel input,.panel select{width:100%}.hint{font-size:12px;color:#b9a9c7;line-height:1.8}.error{color:#ffb4b4;font-size:13px;min-height:18px}
</style></head><body><main><header class="top"><div><div class="brand">السعد <span>♥</span></div><div class="sub">بين قلبين… بلغتين</div></div><div id="status" class="status">غير متصل</div></header><section id="chat" class="chat"><div class="empty" id="empty">هنا تبدي سوالفكم الحلوة ♥<br>المحادثات لا تُحفظ على السيرفر.</div></section><form class="compose" id="sendForm"><input id="message" placeholder="اكتب رسالتك…" maxlength="500" autocomplete="off" required><button>إرسال ♥</button></form></main><div class="overlay" id="overlay"><form class="panel" id="joinForm"><h1>السعد ♥ ALSAAD Chat</h1><p>مراسلة خاصة بين العربي والكردي السوراني</p><label>لغتك</label><select id="role"><option value="ar">العربية</option><option value="ckb">کوردی سۆرانی</option></select><label>رقم الغرفة (6 أرقام، نفسه عند الطرفين)</label><input id="room" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="مثلاً 123456" required><label>كلمة سر مشتركة (8 أحرف على الأقل)</label><input id="secret" type="password" minlength="8" maxlength="100" placeholder="كلمة سر قوية" required><div class="hint">استخدموا نفس رقم الغرفة وكلمة السر، واختار كل واحد لغته. لا تشاركوا الرمز مع غيركم.</div><div class="error" id="error"></div><button>دخول المحادثة ♥</button></form></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),chat=document.getElementById('chat'),status=document.getElementById('status');let role='ar',joined=false;
document.getElementById('joinForm').onsubmit=e=>{e.preventDefault();role=document.getElementById('role').value;socket.emit('join',{room:document.getElementById('room').value,secret:document.getElementById('secret').value,role},result=>{if(result.ok){joined=true;document.getElementById('overlay').hidden=true;document.getElementById('overlay').style.display='none';status.textContent='متصل ♥'}else document.getElementById('error').textContent=result.error})};
document.getElementById('sendForm').onsubmit=e=>{e.preventDefault();if(!joined)return;const field=document.getElementById('message'),value=field.value.trim();if(!value)return;socket.emit('message',value,result=>{if(!result?.ok)alert('تعذر إرسال الرسالة')});field.value=''};
socket.on('message',m=>{document.getElementById('empty')?.remove();const bubble=document.createElement('div');bubble.className='bubble '+(m.from===role?'me':'');const meta=document.createElement('div');meta.className='meta';meta.textContent=m.from===role?'إنت':'حبيبتك';bubble.append(meta);const main=document.createElement('div');main.textContent=m.from===role?m.original:m.translated;bubble.append(main);if(m.translatedOk){const orig=document.createElement('details');orig.className='original';const summary=document.createElement('summary');summary.textContent=m.from===role?'عرض الترجمة':'عرض النص الأصلي';orig.append(summary);const txt=document.createElement('div');txt.textContent=m.from===role?m.translated:m.original;orig.append(txt);bubble.append(orig)}else{const warn=document.createElement('div');warn.className='warn';warn.textContent='الترجمة غير متاحة حالياً — النص الأصلي';bubble.append(warn)}chat.append(bubble);chat.scrollTop=chat.scrollHeight});
socket.on('presence',p=>{status.textContent=p.count===2?'متصلين ♥':'بانتظار الطرف الثاني'});socket.on('disconnect',()=>{status.textContent='انقطع الاتصال';joined=false;document.getElementById('overlay').style.display='grid'});
</script></body></html>
